<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Neon Login Page</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Segoe UI, sans-serif;
}

body{
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
    overflow:hidden;
    background:#000;
}

/* Animated Background */

body::before{
    content:"";
    position:absolute;
    width:200%;
    height:20000%;
    background:
    radial-gradient(circle,#00f7ff 1px,transparent 1px),
    radial-gradient(circle,#ffffff 1px,transparent 1px);
    background-size:60px 60px;
    animation:stars 30s linear infinite;
    opacity:.5;
}

@keyframes stars{
    from{
        transform:translateY(0);
    }
    to{
        transform:translateY(-500px);
    }
}

/* Login Box */

.login-box{
    position:relative;
    width:380px;
    padding:40px;
    background:rgba(24, 24, 24, 0.85);
    border-radius:20px;
    backdrop-filter:blur(20px);
    box-shadow:0 0 20px #00f7ff,
               0 0 40px #00f7ff;
    animation:popup 1s ease;
    z-index:1;
}

@keyframes popup{
    from{
        transform:scale(.5);
        opacity:0;
    }
    to{
        transform:scale(1);
        opacity:1;
    }
}

.login-box h2{
    color:#00f7ff;
    text-align:center;
    margin-bottom:30px;
    letter-spacing:2px;
}

.inputBox{
    margin:20px 0;
}

.inputBox input{
    width:100%;
    padding:14px;
    border:none;
    outline:none;
    background:#111;
    color:#fff;
    border:2px solid #00f7ff;
    border-radius:30px;
    transition:.4s;
}

.inputBox input:focus{
    box-shadow:0 0 15px #00f7ff;
}

.password{
    position:relative;
}

.password span{
    position:absolute;
    right:20px;
    top:14px;
    color:#00f7ff;
    cursor:pointer;
    user-select:none;
}

button{
    width:100%;
    padding:14px;
    border:none;
    margin-top:20px;
    border-radius:30px;
    background:#00f7ff;
    color:#000;
    font-size:18px;
    cursor:pointer;
    transition:.4s;
    font-weight:bold;
}

button:hover{
    background:#fff;
    box-shadow:0 0 20px #00f7ff;
    transform:translateY(-3px);
}

.links{
    text-align:center;
    margin-top:20px;
}

.links a{
    color:#00f7ff;
    text-decoration:none;
}

.links a:hover{
    color:#fff;
}
</style>

</head>
<body>

<div class="login-box">

<h2>LOGIN</h2>

<form>

<div class="inputBox">
<input type="text" placeholder="Username" required>
</div>

<div class="inputBox password">
<input type="password" id="pass" placeholder="Password" required>
<span onclick="togglePassword()">👁</span>
</div>

<button>Login</button>

<div class="links">
<br>
<a href="#">Forgot Password?</a>
<br><br>
<a href="#">Create Account</a>
</div>

</form>

</div>

<script>
function togglePassword(){
    var pass=document.getElementById("pass");

    if(pass.type==="password"){
        pass.type="text";
    }else{
        pass.type="password";
    }
}
</script>

</body>
</html>
